spring.application.name=finishing-tracking

# Port configuration (Defaults to 7860 for Hugging Face Spaces; overridable via PORT or SERVER_PORT)
server.port=${PORT:${SERVER_PORT:7860}}

# Load secrets from the project-root .env file for local dev (optional in Docker/production)
spring.config.import=optional:file:.env[.properties]

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — Tuned for Serverless / Cloud PostgreSQL (Neon, Supabase, AWS RDS)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=540000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=ScheduleHikariPool

# Hibernate
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=ERROR
spring.jpa.open-in-view=false

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:5173,https://your-frontend.hf.space,https://your-app.vercel.app,https://*.vercel.app}

# Bootstrap Admin
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@ottima.com}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}

# Spring Core
spring.main.banner-mode=off
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.messages.basename=message

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=604800000
jwt.refresh-token.expiration-minutes=10080

# Mail — Brevo Transactional Email API
app.brevo.api-key=${BREVO_API_KEY}
app.brevo.sender-email=${BREVO_SENDER_EMAIL}
app.brevo.sender-name=${BREVO_SENDER_NAME}

# Logging
logging.level.root=WARN
logging.level.com.ottima.finishing_tracking=INFO
app.base-url=${APP_BASE_URL:http://localhost:7860}

# Swagger UI / OpenAPI docs
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

# Cloudinary
cloudinary.name=${CLOUDINARY_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Actuator (runs on main port so health checks succeed in containerized environments)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Hashids
HASHIDS_SALT=${HASHIDS_SALT}